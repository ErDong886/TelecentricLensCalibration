[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telecentric-calib"
version = "1.0.0"
description = "Telecentric camera calibration"
requires-python = ">=3.7"
dependencies = [
    "opencv-python>=4.5.0",
    "numpy>=1.19.0",
    "scipy>=1.5.0",
    "matplotlib>=3.3.0",
    "pyyaml>=5.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
